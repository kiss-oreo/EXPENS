# Publishes the app.
#
# Push a tag like `v1.2.0` and this workflow will:
#   1. check the tag matches the version in pubspec.yaml
#   2. run the full test suite
#   3. build release APKs (one per ABI)
#   4. gate every APK through tool/verify_apk.sh (the libsqlite3.so check)
#   5. publish a GitHub Release with stable asset names + SHA-256 checksums
#
# Release assets are named expens-<abi>.apk. Signing secrets make the APK
# an update to a previous Expens install; without them Gradle still builds
# a release APK with the debug key.

name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  release:
    name: Build, verify & publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches pubspec version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC="$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1 | tr -d '[:space:]')"
          if [ "$TAG" != "$PUBSPEC" ]; then
            echo "::error::Tag v$TAG does not match pubspec.yaml version $PUBSPEC."
            echo "Bump pubspec.yaml (and AppInfo — test/branding_test.dart guards it) before tagging."
            exit 1
          fi

      - name: Install sqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          # Keep on its own line, single-quoted. The F-Droid build recipe reads
          # this Flutter version with sed to build against the same toolchain as
          # CI. Don't reformat this line.
          flutter-version: '3.38.9'
          cache: true

      # A missing keystore must not write a broken key.properties. Gradle then
      # signs the release APK with the debug key, which is enough to sideload.
      - name: Configure release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "No release keystore configured. APK will be debug-signed and can be sideloaded."
            rm -f android/key.properties
            # A fresh runner has no debug keystore. Gradle refuses to sign
            # without the standard file, alias and passwords.
            mkdir -p "$HOME/.android"
            if [ ! -f "$HOME/.android/debug.keystore" ]; then
              keytool -genkeypair -v \
                -keystore "$HOME/.android/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "debug" > /tmp/signing-mode.txt
            exit 0
          fi
          echo "release" > /tmp/signing-mode.txt
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/xpenc-release.jks"
          cat > android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=$GITHUB_WORKSPACE/android/xpenc-release.jks
          EOF

      # `--enforce-lockfile` refuses to silently rewrite pubspec.lock if it's
      # out of sync with pubspec.yaml — F-Droid's own reproducible build uses
      # the same flag (see docs/fdroid/metadata-com.yash.xpenc.yml), so a
      # drifted lock file must fail *here*, at tag time, not on their side
      # after the tag is already out (GitHub #57).
      - name: Pub get
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          code=$?
          cat /tmp/analyze.log
          if [ "$code" -ne 0 ]; then
            bash tool/annotate_log.sh /tmp/analyze.log
          fi
          exit "$code"

      - name: Build release APKs
        run: |
          set +e
          mkdir -p release
          flutter build apk --release > /tmp/apk-build.log 2>&1
          code=$?
          cat /tmp/apk-build.log
          if [ "$code" -ne 0 ]; then
            bash tool/annotate_log.sh /tmp/apk-build.log
            exit "$code"
          fi
          # Copy before the split build. A later Gradle invocation can clear
          # flutter-apk/ and drop the universal APK.
          cp build/app/outputs/flutter-apk/app-release.apk release/expens.apk
          flutter build apk --release --split-per-abi >> /tmp/apk-build.log 2>&1
          code=$?
          tail -n 80 /tmp/apk-build.log
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   release/expens-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/expens-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      release/expens-x86_64.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: expens-apk
          path: release/*.apk
          if-no-files-found: error

      - name: Verify APKs (libsqlite3.so gate)
        run: |
          for apk in release/*.apk; do
            bash tool/verify_apk.sh "$apk"
          done

      - name: Test
        run: |
          set +e
          flutter test > /tmp/test.log 2>&1
          code=$?
          cat /tmp/test.log
          if [ "$code" -ne 0 ]; then
            bash tool/annotate_log.sh /tmp/test.log
          fi
          exit "$code"

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for f in /tmp/analyze.log /tmp/apk-build.log /tmp/test.log; do
            if [ -f "$f" ]; then
              bash tool/annotate_log.sh "$f"
              {
                echo "## $f"
                echo '```text'
                tail -n 120 "$f"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          # Issues are disabled on this repo. A check-run body is readable
          # through the API when the token can write checks.
          python3 - << 'PY'
          import json, os
          from pathlib import Path
          chunks = []
          for name in ("analyze.log", "apk-build.log", "test.log"):
              path = Path("/tmp") / name
              if path.exists():
                  chunks.append(f"## {name}\n" + path.read_text(errors="replace")[-20000:])
          text = "\n".join(chunks)[:60000]
          Path("/tmp/check.json").write_text(json.dumps({
              "name": "APK build log",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": "failure",
              "output": {
                  "title": "Release job log",
                  "summary": text[:5000] or "no log",
                  "text": text or "no log",
              },
          }))
          PY
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input /tmp/check.json || true
          exit 0

      - name: Checksums
        working-directory: release
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/expens.apk
            release/expens-arm64-v8a.apk
            release/expens-armeabi-v7a.apk
            release/expens-x86_64.apk
            release/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            **Expens — Money, tracked honestly.** Fork of XPENC.

            Install `expens.apk` (or the smaller arm64 file on a phone from 2017 or later). Android may ask you to allow installs from the browser. Play Protect can warn because this build declares RECEIVE_SMS so a bank SMS can be recorded as it arrives. The inbox is never read. If you want that capture, choose install anyway.

            | Platform | Your device | Download |
            |---|---|---|
            | **(Android)** | Any phone · install this one | [`expens.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/expens.apk) |
            | **(Android)** | Most phones (2017+), smaller file | [`expens-arm64-v8a.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/expens-arm64-v8a.apk) |
            | **(Android)** | Older 32-bit phones | [`expens-armeabi-v7a.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/expens-armeabi-v7a.apk) |
            | **(Android)** | Emulators | [`expens-x86_64.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/expens-x86_64.apk) |

            Signing uses the repository keystore secrets. Without them the
            release APK is still built, with the debug keystore, and is not
            an update to a previously signed install.

            Verify your download against `SHA256SUMS.txt`.
            History: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md).
            Upstream: [XPENC](https://github.com/PATILYASHH/XPENC).
